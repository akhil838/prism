name: Build APKs

# Manual build: pick the CPU architecture(s) and the build type(s), download the APKs from the run.
on:
  workflow_dispatch:
    inputs:
      option_1:
        description: "CPU architecture (all = one APK per ABI + universal)"
        type: choice
        default: all
        options: [all, universal, arm64-v8a, armeabi-v7a, x86_64, x86]
      option_2:
        description: "Build type"
        type: choice
        default: both
        options: [both, release, debug]
      option_3:
        description: "Publish the release APKs as GitHub release v<versionName> (Prism's Check for Updates reads it)"
        type: boolean
        default: false

permissions:
  contents: write # only used by the optional publish step

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.option_1 }}
      TYPE: ${{ inputs.option_2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Release builds are signed with the debug key (personal sideload build). A runner would make its
      # own key, and those APKs could not install over a local build. Optional secret
      # DEBUG_KEYSTORE_BASE64 = base64 of your ~/.android/debug.keystore restores the same key.
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "SIGNING=your debug key (DEBUG_KEYSTORE_BASE64)" >> "$GITHUB_ENV"
          else
            echo "SIGNING=a fresh CI debug key: uninstall Prism before installing these APKs" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          case "$ARCH" in
            all)       ABI_ARGS="-Pabis=armeabi-v7a,arm64-v8a,x86,x86_64 -Puniversal=true" ;;
            universal) ABI_ARGS="" ;;
            *)         ABI_ARGS="-Pabis=$ARCH" ;;
          esac
          case "$TYPE" in
            both)    TASKS=":app:assembleRelease :app:assembleDebug" ;;
            release) TASKS=":app:assembleRelease" ;;
            debug)   TASKS=":app:assembleDebug" ;;
          esac
          ./gradlew $TASKS $ABI_ARGS --console=plain

      - name: Collect APKs
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            # app-arm64-v8a-release.apk -> prism-0.1.0-arm64-v8a-release.apk; app-release.apk -> prism-0.1.0-universal-release.apk
            name=$(basename "$apk" .apk); name=${name#app-}
            case "$name" in release|debug) name="universal-$name" ;; esac
            cp "$apk" "dist/prism-$VERSION-$name.apk"
          done
          {
            echo "### Prism $VERSION: $ARCH / $TYPE"
            echo
            echo "Signed with $SIGNING."
            echo
            echo '| APK | Size |'
            echo '|---|---|'
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: prism-apks-${{ inputs.option_1 }}-${{ inputs.option_2 }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # Prism's About -> Check for Updates reads releases/latest and installs prism-<v>-<abi>-release.apk.
      - name: Publish release
        if: inputs.option_3 && inputs.option_2 != 'debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/*-release.apk --clobber
          else
            gh release create "v$VERSION" dist/*-release.apk --title "Prism $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
